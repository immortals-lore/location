<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>服務台視覺化查詢系統</title>
  <style>
    :root {
      --primary: #1a237e;
      --highlight: #ffb74d;        /* 淡橘色目標格 */
      --highlight-border: #f57c00; /* 深橘色邊框 */
      --bg: #f4f6fa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      margin: 0;
      padding: 12px;
      color: #333;
    }
    .container {
      max-width: 980px;
      margin: 0 auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }
    h2 {
      margin: 0 0 10px 0;
      text-align: center;
      color: var(--primary);
      font-size: 1.3rem;
    }

    /* 💡 測試階段專屬提示橫幅 (日後正式上線只需刪除此區塊即可) */
    .test-notice {
      background: #fff8e1;
      border: 1px dashed #ffa000;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      color: #b76e00;
      text-align: center;
      line-height: 1.6;
    }
    .test-notice code {
      background: #ffffff;
      color: #d84315;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      border: 1px solid #ffd54f;
      margin: 0 2px;
      font-family: monospace;
    }

    /* 搜尋列結構 (完美還原對齊，絕不跑版) */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1.5px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    button.btn-search {
      padding: 0 22px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button.btn-sync {
      padding: 0 12px;
      background: #eceff1;
      color: #455a64;
      border: 1px solid #cfd8dc;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .status-msg {
      font-size: 0.85rem;
      color: #777;
      text-align: center;
      margin-bottom: 12px;
    }
    .empty-msg {
      display: none;
      background: #fff3e0;
      border: 1px solid #ffe0b2;
      color: #e65100;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
    }

    /* 資訊卡片 */
    .info-card {
      display: none;
      background: #eef2f7;
      border-left: 5px solid var(--primary);
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 15px;
      line-height: 1.6;
    }
    .info-card h3 { margin: 0 0 6px 0; color: var(--primary); font-size: 1.2rem; }
    .loc-badge {
      display: inline-block;
      background: #263238;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* 視覺化透視圖 */
    .cabinet-area {
      display: none;
      margin-top: 15px;
    }
    .cabinet-header {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      color: #333;
    }
    .scroll-wrapper {
      overflow-x: auto;
      border: 1.5px solid #cfd8dc;
      border-radius: 8px;
      background: #fafafa;
      padding: 10px;
    }
    .grid {
      display: inline-grid;
      grid-template-columns: 52px repeat(26, 44px);
      gap: 3px;
      user-select: none;
    }
    .axis-label {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      color: #546e7a;
    }
    .axis-y { height: 26px; }
    .axis-x { width: 52px; height: 44px; white-space: nowrap; }

    .cell {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #b0bec5;
      box-sizing: border-box;
    }
    .cell.active {
      background: var(--highlight) !important;
      color: #bf360c !important;
      border: 2px solid var(--highlight-border);
      font-weight: bold;
      animation: pulse 1.6s infinite;
      z-index: 2;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 183, 77, 0.7); }
      70% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(255, 183, 77, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 183, 77, 0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📍 服務台視覺化查詢系統</h2>

<!-- 💡 測試階段專屬提示橫幅：日後正式對外公開時，只要刪除這一段即可 -->
  <div id="testNotice" class="test-notice">
    ⚠️ <b>【系統內部測試中】</b><br>
    本系統尚未正式對外公開，目前僅提供 <br>
    <code>00001</code>、<code>00002</code>、<code>00003</code> <br>
    三筆資料供測試查詢。
  </div>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="請輸入查詢編號 (例: 00001)" autofocus>
    <button class="btn-search" onclick="handleSearch()">查詢</button>
    <button class="btn-sync" onclick="syncData(true)" title="立即同步最新資料">🔄 同步</button>
  </div>
  
  <div id="status" class="status-msg">正在連線至試算表...</div>
  <div id="emptyNotice" class="empty-msg">⚠️ 查無此查詢編號，暫無該筆資料！</div>

  <!-- 查詢結果資訊 -->
  <div id="infoCard" class="info-card">
    <h3 id="itemTitle">物品名稱</h3>
    <div>儲位編號：<b><span id="itemId"></span></b></div>
    <div>位置代碼：<span id="itemLoc" class="loc-badge"></span></div>
    <div>實體位置：<b><span id="itemFloor"></span> 樓 ｜ <span id="itemPillar"></span> 柱</b></div>
    <div>櫃位座標：<b>橫向 Y軸：<span id="itemY"></span> 列 ｜ 高度 X軸：第 <span id="itemX"></span> 層</b></div>
  </div>

  <!-- 柱位 260 格透視圖 -->
  <div class="cabinet-area" id="cabinetArea">
    <div class="cabinet-header">
      <span>透視圖（正面視角：高 10 層 × 寬 26 格）</span>
      <span style="color:var(--highlight-border);">● 淡橘色為存放位置</span>
    </div>
    <div class="scroll-wrapper" id="scrollWrapper">
      <div id="gridContainer" class="grid"></div>
    </div>
  </div>
</div>

<script>
  // 🔴 您的 Google Apps Script API 網址 (已為您保留)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9v_3yk3k8pzsB2Aw95w-FC8hNsLqpetwlAN75SuSZg7xOswhy9jZtacBUkSu2YIaE/exec";

  const Y_AXIS_LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  let inventoryList = [];

  // 1. 同步最新資料 (加上時間戳記防止快取)
  async function syncData(manual = false) {
    const statusEl = document.getElementById("status");
    if (manual) statusEl.innerText = "⏳ 正在同步最新資料中...";

    try {
      const noCacheUrl = `${SCRIPT_URL}?_t=${new Date().getTime()}`;
      const res = await fetch(noCacheUrl);
      inventoryList = await res.json();
      statusEl.innerText = `🟢 資料庫連線正常 (目前在庫 ${inventoryList.length} 筆物料)`;
      return true;
    } catch (err) {
      statusEl.innerText = "🔴 連線失敗，請檢查網路或 Google 授權。";
      return false;
    }
  }

  // 2. 執行查詢
  async function handleSearch() {
    const kw = document.getElementById("keyword").value.trim().toLowerCase();
    const emptyNotice = document.getElementById("emptyNotice");
    const infoCard = document.getElementById("infoCard");
    const cabinetArea = document.getElementById("cabinetArea");

    emptyNotice.style.display = "none";
    infoCard.style.display = "none";
    cabinetArea.style.display = "none";

    if (!kw) return;

    let item = findItem(kw);

    // 本地找不到時，自動向 Google 試算表即時重抓一次確認
    if (!item) {
      document.getElementById("status").innerText = "🔍 本地查無，正在向 Google 試算表同步最新資料...";
      await syncData();
      item = findItem(kw);
    }

    if (!item) {
      emptyNotice.style.display = "block";
      return;
    }

    renderView(item);
  }

  // 只依「物品編號 (ID)」進行比對
  function findItem(kw) {
    return inventoryList.find(d => d.id.toLowerCase() === kw);
  }

  // 3. 繪製結果卡片與 260 格櫃體
  function renderView(item) {
    document.getElementById("infoCard").style.display = "block";
    document.getElementById("cabinetArea").style.display = "block";

    document.getElementById("itemTitle").innerText = item.name;
    document.getElementById("itemId").innerText = item.id;
    document.getElementById("itemLoc").innerText = item.location;
    document.getElementById("itemFloor").innerText = item.floor;
    document.getElementById("itemPillar").innerText = item.pillar;
    document.getElementById("itemY").innerText = item.y;
    document.getElementById("itemX").innerText = item.x;

    const grid = document.getElementById("gridContainer");
    grid.innerHTML = "";

    // 頂部 Y軸 字母標籤
    const corner = document.createElement("div");
    corner.className = "axis-label axis-y";
    corner.innerText = "層\\列";
    grid.appendChild(corner);

    for (let y of Y_AXIS_LETTERS) {
      const yLabel = document.createElement("div");
      yLabel.className = "axis-label axis-y";
      yLabel.innerText = y;
      grid.appendChild(yLabel);
    }

    let targetElement = null;

    // 高度「第9層」~「第0層」
    for (let x = 9; x >= 0; x--) {
      const xLabel = document.createElement("div");
      xLabel.className = "axis-label axis-x";
      xLabel.innerText = `第${x}層`;
      grid.appendChild(xLabel);

      for (let y of Y_AXIS_LETTERS) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.innerHTML = `<span>${y}</span><span>${x}</span>`;

        if (y === item.y && x === item.x) {
          cell.classList.add("active");
          cell.innerHTML = `★<br><b style="font-size:8px;">${item.name}</b>`;
          targetElement = cell;
        }

        grid.appendChild(cell);
      }
    }

    // 自動滾動聚焦
    if (targetElement) {
      setTimeout(() => {
        targetElement.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
      }, 180);
    }
  }

  document.getElementById("keyword").addEventListener("keypress", (e) => {
    if (e.key === "Enter") handleSearch();
  });

  syncData();
</script>
</body>
</html>
